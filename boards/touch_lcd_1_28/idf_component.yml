## Board-specific managed dependencies (installed only when this board is selected).
## This board has no vendor BSP package on the registry, so it composes its BSP
## from Espressif's LCD/touch/LVGL-port drivers. LVGL itself comes from the
## common main/idf_component.yml.
dependencies:
  # GC9A01 240x240 SPI display controller.
  espressif/esp_lcd_gc9a01:
    version: "^2.0.4"
  # CST816S capacitive touch controller (I2C).
  espressif/esp_lcd_touch_cst816s:
    version: "^1.1.2"
  # LVGL port: LVGL task, display flush, and touch input for esp_lcd panels.
  espressif/esp_lvgl_port:
    version: "^2.9.0"
  # On-board QMI8658 6-axis IMU; the BSP does not expose an IMU API.
  waveshare/qmi8658:
    version: "1.0.0"
