## Board-specific managed dependencies (installed only when this board is selected).
## The AXP2101 PMU driver is the local components/XPowersLib; LVGL comes from the
## common main/idf_component.yml.
dependencies:
  # BSP: SH8601 display, FT5x06 touch, esp_codec_dev, esp_lvgl_port, SD/I2C wiring.
  waveshare/esp32_s3_touch_amoled_2_06:
    version: "2.0.0"
  # On-board QMI8658 6-axis IMU driver.
  waveshare/qmi8658:
    version: "1.0.0"
